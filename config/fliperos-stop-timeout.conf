# /etc/systemd/system.conf.d/fliperos-stop.conf e
# /etc/systemd/user.conf.d/fliperos-stop.conf (fliperos-rootfs.sh): no reboot
# e no desligamento, um servico que nao sai no SIGTERM leva o SIGKILL em 10 s,
# nao nos 90 s padrao (o gabinete ficava minuto e meio na tela do Plymouth
# por um filho preso do painel web). Quem precisa de mais tempo diz no
# proprio servico: o update ao desligar (fliperos-update-shutdown.service)
# tem 20 min.
[Manager]
DefaultTimeoutStopSec=10s
