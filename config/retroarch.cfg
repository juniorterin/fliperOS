# RetroArch — config de SISTEMA do FliperOS. O fliperos-kms-run passa este
# arquivo com --appendconfig, entao ele entra POR CIMA da config do usuario
# (~/.config/retroarch/retroarch.cfg): o que esta aqui vale em toda abertura,
# venha do menu de texto ou da sessao de boot, e o resto que o usuario muda
# no menu do RetroArch continua salvo no home dele. So entram aqui as chaves
# que quebram o video no CRT, que dependem de como o FliperOS e compilado, ou
# que o fliperos-setup controla. Pra mudar uma delas, edite este arquivo.
#
# Build so com KMS/DRM, sem X11 (build_retroarch_chroot() em
# fliperos-mkiso.sh): video_context_driver fica sem valor de proposito, o
# KMS e o unico contexto compilado.

# ── Video ─────────────────────────────────────────────────────
# "gl" e o driver que troca de modo em KMS. Em Vulkan o contexto KMS vira
# khr_display, que gera os modos mas nao aplica nenhum.
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "false"
# 0x0 = o modo ativo da saida (o modo de boot, 640x480i no CRT de 15 kHz). Um
# tamanho fixo que o conector nao liste faz o RetroArch abortar ("Did not
# find suitable video mode") em vez de abrir.
video_fullscreen_x = "0"
video_fullscreen_y = "0"
video_vsync = "true"
# O tubo ja faz o "filtro"; bilinear so borra.
video_smooth = "false"
# Com a super resolucao abaixo a escala inteira deixaria faixa preta nas
# larguras que nao dividem 2560 (368 do PS1, por exemplo).
video_scale_integer = "false"

# ── Latencia ──────────────────────────────────────────────────
# Valores do modo padrao; Setup > Latency troca os do modo de baixa latencia
# (fliperos-setup/lib/latency.sh, README secao "Latencia").
# 2 = espera cada flip antes do proximo quadro: um quadro a menos de
# latencia em KMS. Mesmo valor do GroovyArcade.
video_max_swapchain_images = "2"
# Video na mesma thread da emulacao: a thread separada soma um quadro.
video_threaded = "false"
# 2 = le os controles o mais tarde possivel, quando o core pede.
input_poll_type_behavior = "2"
video_frame_delay = "0"
# Baixa latencia: "true". Comeca em meio quadro de espera antes de emular e
# recua sozinho se os quadros comecarem a atrasar.
video_frame_delay_auto = "false"
# Baixa latencia: preemptive frames de 1 quadro. Tira o atraso interno do
# jogo refazendo o ultimo quadro so quando a entrada muda (mais leve que o
# run-ahead, que refaz todo quadro).
run_ahead_enabled = "false"
run_ahead_frames = "1"
preemptive_frames_enable = "false"

# ── CRT SwitchRes ─────────────────────────────────────────────
# Gera um modo com a resolucao e a frequencia de cada jogo e troca na hora,
# inclusive no meio da partida (240p <-> 480i). O KMS aplica o modo gerado
# direto no DRM, sem Xorg.
# 4 = monitor e geometria do /etc/switchres.ini — o mesmo arquivo que o
# fliperos-setup grava ao escolher o monitor e ao calibrar a geometria.
crt_switch_resolution = "4"
# Super resolucao: a largura fica fixa em 2560 e so a altura e a frequencia
# mudam, entao troca menos de modo entre jogos e o pixel clock fica perto de
# 52 MHz, que toda placa gera, inclusive Intel e NVIDIA (sem dotclock baixo).
# No CRT nao aparece: a varredura horizontal e analogica.
# 0 = largura nativa, que o GroovyArcade usa; com o kernel 15 kHz ela funciona
# nas placas AMD (radeon/amdgpu). O fliperos-setup troca para 0 quando o
# teste de saidas acha uma placa que gera dotclock baixo
# (video_retroarch_super): em 2560 as notificacoes saem espremidas no tubo.
# 2560 fica so como padrao para placa desconhecida.
crt_switch_resolution_super = "2560"
# Menu sem jogo em 320x240@60. O menu de alta resolucao seria 640x480, que
# a 15 kHz so existe entrelacado e cintila.
crt_switch_hires_menu = "false"

# ── Audio ─────────────────────────────────────────────────────
# O FliperOS so tem ALSA, sem servidor de som. Com o libpulse-dev no build
# (outro emulador o instala), o padrao compilado do RetroArch vira "pulse",
# que fica mudo sem servidor. A placa padrao vem do /etc/asound.conf que o
# fliperos-setup grava (Setup > Audio Setup).
audio_driver = "alsa"

# ── Entrada ───────────────────────────────────────────────────
# udev le teclado e controles direto do /dev/input (usuario no grupo input).
# O driver de controle nao fica fixo aqui (este arquivo vem por cima do do
# usuario a cada abertura): o padrao compilado e o udev, que mostra no menu
# o numero de verdade de cada botao; o sdl2 (mapeamentos do
# fliperos-controllers, como nos outros emuladores) se escolhe em Drivers >
# Controle e fica.
input_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/opt/fliperos/retroarch/autoconfig"
# Start + Select abre o menu: painel de fliper nao tem teclado nem botao
# guide.
input_menu_toggle_gamepad_combo = "4"

# ── Menu ──────────────────────────────────────────────────────
# RGUI foi feito pra baixa resolucao. O padrao compilado (Ozone) fica
# ilegivel num CRT de 15 kHz.
menu_driver = "rgui"
# 17 = tema Dracula embutido no RGUI (RGUI_THEME_DRACULA em
# menu/menu_defines.h), o mesmo do resto do FliperOS.
rgui_menu_color_theme = "17"
# As opcoes de CRT SwitchRes so aparecem no menu com isto ligado.
menu_show_advanced_settings = "true"

# ── Caminhos ──────────────────────────────────────────────────
# Cores, informacoes dos cores e perfis de controle na pasta do usuario
# fliperos: Online Updater > Core Downloader baixa qualquer core do buildbot
# da libretro, e "Update Core Info Files"/"Update Controller Profiles"
# atualizam o resto, sem root. Os 6 cores de fabrica ja vem ali.
libretro_directory = "/opt/fliperos/retroarch/cores"
libretro_info_path = "/opt/fliperos/retroarch/info"
# rgui_config_directory fica no padrao (~/.config/retroarch/config): opcoes
# de core e remapeamentos precisam de pasta gravavel pelo usuario.
# ROMs em ~/roms, com uma pasta por core (~/roms/retroarch/<core>), e a BIOS
# em ~/bios (fliperos-roms; /opt/fliperos/bios e um link para la); saves em
# /opt/fliperos. O Samba compartilha todos. O fliperos-kms-run cria a pasta
# de saves se faltar.
rgui_browser_directory = "/home/fliperos/roms"
system_directory = "/home/fliperos/bios"
savefile_directory = "/opt/fliperos/saves/retroarch"
savestate_directory = "/opt/fliperos/saves/retroarch"
