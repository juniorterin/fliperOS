# RetroArch — build KMS/DRM (sem X11, ver build_retroarch_chroot() em
# fliperos-mkiso.sh). video_context_driver fica sem valor de proposito: o
# build so tem KMS compilado (sem X11/Wayland/SDL), entao e a unica opcao
# e o RetroArch autodetecta sozinho.
video_fullscreen = "true"
video_windowed_fullscreen = "false"
video_fullscreen_x = "640"
video_fullscreen_y = "240"
video_vsync = "true"

input_autodetect_enable = "true"
input_joypad_driver = "udev"
joypad_autoconfig_enable = "true"
joypad_autoconfig_dir = "/etc/fliperos/retroarch/autoconfig"

libretro_directory = "/etc/fliperos/retroarch/cores"
libretro_info_path = "/etc/fliperos/retroarch/cores"
rgui_config_directory = "/etc/fliperos/retroarch"
