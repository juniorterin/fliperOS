# Jogos 2D da Midway (drivers midyunit, midtunit, midwunit e midxunit: Mortal
# Kombat 1-3, NBA Jam, Smash TV, NARC...). O fliperos-rootfs.sh instala este
# arquivo como /etc/fliperos/mame/source/<driver>.ini, que o GroovyMAME le
# depois do mame.ini so para os jogos daquele driver.
#
# Eles sao 400x254 a 54,7 Hz. O Switchres gera esse modo exato, mas no tubo a
# imagem fica esticada na vertical: sao mais linhas que os jogos de 224/240 e a
# deflexao vertical da TV nao compensa o quadro mais longo dos 54,7 Hz (visto
# no gabinete em 2026-11-09). Aqui saem em 320x240p a 59 Hz, da altura dos
# outros jogos; o jogo continua a 54,7 Hz (syncrefresh 0 do mame.ini).
#
# switchres_ini 0: com o switchres.ini ligado, o GroovyMAME ignora o monitor e
# o crt_range do mame.ini. A faixa e a do generic_15 so com 59-61 Hz e ate 240
# linhas progressivas.
switchres_ini             0
monitor                   custom
crt_range0                15625.00-15750.00,59.00-61.00,2.000,4.700,8.000,0.064,0.192,1.024,0,0,192,240,448,480
interlace                 0
resolution                320x240
