# FliperOS: where each game keeps the score of a versus match, for the LED
# display (config/fliperos-versus). The game only draws the score on the
# screen, so it is read from the game's memory.
#
# One value per line:
#
#   SOURCE  GAME  FIELD  ADDRESS  BYTES  FORMAT  [CPU]
#
#   SOURCE   mame       GroovyMAME: the address in the CPU's program space
#            retroarch  a RetroArch core: the address READ_CORE_MEMORY takes
#                       (the core's memory map; it is not the MAME address)
#   GAME     the set name (sf2); a clone uses its parent's lines, see below
#   FIELD    score1 score2    each player's points
#            rounds1 rounds2  rounds won in the current match; the match
#                             winner is counted when they go back to zero
#            wins1 wins2      matches won, if the game itself counts them
#                             (then the rounds are not needed)
#   ADDRESS  hexadecimal (0xFF8ABC)
#   BYTES    how many bytes the value takes
#   FORMAT   bcd    packed decimal, most significant byte first
#            bcdle  packed decimal, least significant byte first
#            bin    binary, most significant byte first
#            binle  binary, least significant byte first
#            add *10 or *100 when the game doesn't store the last digits (bcd*10)
#   CPU      mame only: the device tag, when it is not :maincpu
#
#   clone  GAME  PARENT       GAME uses the lines of PARENT
#
# A game only goes in here after its values were watched during a real match:
#
#   fliperos-versus watch mame sf2      (with the game open) prints each field
#                                       as it changes
#
# A wrong address shows a wrong score, nothing worse. To try an address
# without changing this file, put the line in ~/config/versus-games.conf: it
# is read after this one, and a game there replaces the same game here.
