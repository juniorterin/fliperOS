# Interface do GroovyMAME: as linhas de texto na tela e o tamanho do texto
# de informacoes do GroovyArcade (o ui_ini_config do gasetup), e as cores
# (menus, lista de jogos, sliders) no tema Dracula. Formato ARGB: os dois
# primeiros digitos sao a opacidade (ef = o fundo levemente translucido do
# padrao do MAME). Instalado como /etc/fliperos/mame/ui.ini, na mesma pasta
# do mame.ini.
# font_rows 20, o minimo que o MAME aceita (20-40; o 19 do GroovyArcade e
# descartado e volta o 30): 224 linhas / 20 = 11 pixels por linha, a altura
# da fonte uismall.bdf. Com 30 a fonte fica com 7 e nao se le.
font_rows                 20
infos_text_size           1.00
ui_border_color           ffbd93f9
ui_bg_color               ef282a36
ui_gfxviewer_color        ef282a36
ui_unavail_color          ff6272a4
ui_text_color             fff8f8f2
ui_text_bg_color          ef21222c
ui_subitem_color          ff8be9fd
ui_clone_color            ff6272a4
ui_selected_color         ffff79c6
ui_selected_bg_color      ef44475a
ui_mouseover_color        ff50fa7b
ui_mouseover_bg_color     7044475a
ui_mousedown_color        ff50fa7b
ui_mousedown_bg_color     b06272a4
ui_dipsw_color            fff1fa8c
ui_slider_color           ffbd93f9
# Favoritos e o que mais a interface grava, em ~/.mame (o padrao "ui" e
# relativo a pasta de onde o GroovyMAME e aberto).
ui_path                   $HOME/.mame/ui
# A arte do Setup > Scraper na lista de jogos (~/media/<tipo>/arcade); a
# captura vem do snapshot_directory do mame.ini. Numa instalacao anterior o
# fliperos-rootfs.sh poe estas pastas na lista que o ui.ini ja tem.
covers_directory          /home/fliperos/media/box/arcade
flyers_directory          /home/fliperos/media/box/arcade
marquees_directory        /home/fliperos/media/marquee/arcade
logos_directory           /home/fliperos/media/logo/arcade
