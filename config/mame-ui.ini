# Cores da interface do GroovyMAME (menus, lista de jogos, sliders) no tema
# Dracula. Formato ARGB: os dois primeiros digitos sao a opacidade (ef = o
# fundo levemente translucido do padrao do MAME). Instalado como
# /etc/fliperos/mame/ui.ini, na mesma pasta do mame.ini (SDL_INI_PATH).
