# GroovyMAME do FliperOS (/etc/fliperos/mame/mame.ini; o comando groovymame
# passa -inipath /etc/fliperos/mame). As opcoes sao as do GroovyArcade (o
# -createconfig do gasetup, core/configs/groovymame), com as pastas daqui:
# os arquivos do GroovyMAME (plugins, fonte, bgfx...) em
# /usr/local/share/groovymame, o que o usuario grava em ~/.mame e as ROMs em
# ~/roms/mame. O Setup grava aqui o monitor, o formato da tela e a latencia.
# Numa instalacao anterior, o fliperos-rootfs.sh acrescenta as chaves que o
# mame.ini dela ainda nao tem.
homepath $HOME/.mame
rompath /home/fliperos/roms/mame
samplepath /home/fliperos/roms/mame/samples
hashpath $HOME/.mame/hash;/usr/local/share/groovymame/hash
artpath $HOME/.mame/artwork;/usr/local/share/groovymame/artwork
ctrlrpath $HOME/.mame/ctrlr;/usr/local/share/groovymame/ctrlr
fontpath /usr/local/share/groovymame/fonts;$HOME/.mame/fonts
pluginspath /usr/local/share/groovymame/plugins;$HOME/.mame/plugins
languagepath $HOME/.mame/language;/usr/local/share/groovymame/language
bgfx_path /usr/local/share/groovymame/bgfx
cheatpath $HOME/.mame/cheat
crosshairpath $HOME/.mame/crosshair
swpath $HOME/.mame/software
cfg_directory $HOME/.mame/cfg
nvram_directory $HOME/.mame/nvram
input_directory $HOME/.mame/inp
state_directory $HOME/.mame/sta
snapshot_directory $HOME/.mame/snap
diff_directory $HOME/.mame/diff
comment_directory $HOME/.mame/comments
# Recordes salvos (plugin hiscore, em ~/.mame/hiscore), sem a tela de
# informacoes do jogo, e a fonte de pixel do MAME na interface (legivel em
# 224 linhas).
plugin hiscore
skip_gameinfo 1
uifont uismall.bdf
video opengl
# Switchres: le o /etc/switchres.ini (o monitor e a geometria do Setup).
# modesetting 0, diferente do GroovyArcade (que usa 1 com o kernel e a
# libdrm dele): aqui o modo nativo de cada jogo sai pelo SDL, que deixa o
# DRM para o Switchres (SDL_KMSDRM_REQUIRE_DRM_MASTER=0, fliperos-kms-run).
# Visto no gabinete: com modesetting 1 e o SDL dono do DRM, o Switchres nao
# aplica o modo (fica o do boot) e o jogo sai pequeno, "espremido"; com 1 e
# a variavel, som e tela preta ("Could not queue pageflip: -13").
switchres 1
switchres_ini 1
modesetting 0
monitor arcade_15
# Formato da tela do CRT, como o GroovyArcade (-aspect "4:3"). Com "auto" o
# GroovyMAME tira o formato do modo atual: num boot em 640x240 (8:3) o
# Switchres dobrava a largura de todo jogo. O Setup troca para "auto" num LCD.
aspect 4:3
interlace 1
joystick 1
# SDL, como o GroovyArcade (-sound sdl). O GroovyMAME tambem tem o modulo do
# PulseAudio, que ficaria mudo: o FliperOS so tem ALSA, sem servidor de som.
sound sdl
samplerate 48000
# Latencia (README, secao "Latencia"; Setup > Latency): desenha o quadro
# antes de esperar o vsync e atrasa o inicio de cada quadro o maximo que a
# CPU aguenta (framedelay 0 = automatico). Sao os padroes do GroovyMAME
# atual; ficam escritos para valer tambem com um mame.ini de versao antiga.
lowlatency 1
autoframedelay 1
framedelay 0
