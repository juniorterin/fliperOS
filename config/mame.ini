# GroovyMAME / Xorg. Dynamic switching still requires testing on the target GPU.
rompath /opt/fliperos/roms/mame
samplepath /opt/fliperos/roms/mame/samples
video opengl
switchres 1
monitor arcade_15
interlace 1
resolution auto
window 0
keepaspect 1
joystick 1
samplerate 48000
# Latencia (README, secao "Latencia"): desenha o quadro antes de esperar o
# vsync e atrasa o inicio de cada quadro o maximo que a CPU aguenta
# (framedelay 0 = automatico). Sao os padroes do GroovyMAME atual; ficam
# escritos para valer tambem com um mame.ini de versao antiga.
lowlatency 1
autoframedelay 1
framedelay 0
