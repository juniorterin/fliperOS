# GroovyMAME / Xorg. Dynamic switching still requires testing on the target GPU.
rompath /home/fliperos/roms/mame
samplepath /home/fliperos/roms/mame/samples
video opengl
switchres 1
monitor arcade_15
# Formato da tela do CRT, como o GroovyArcade (-aspect "4:3"). Com "auto" o
# GroovyMAME tira o formato do modo atual: num boot em 640x240 (8:3) o
# Switchres dobrava a largura de todo jogo. O Setup troca para "auto" num LCD.
aspect 4:3
interlace 1
resolution auto
window 0
keepaspect 1
joystick 1
# SDL, como o GroovyArcade (-sound sdl). O GroovyMAME tambem tem o modulo do
# PulseAudio, que ficaria mudo: o FliperOS so tem ALSA, sem servidor de som.
sound sdl
samplerate 48000
# Latencia (README, secao "Latencia"): desenha o quadro antes de esperar o
# vsync e atrasa o inicio de cada quadro o maximo que a CPU aguenta
# (framedelay 0 = automatico). Sao os padroes do GroovyMAME atual; ficam
# escritos para valer tambem com um mame.ini de versao antiga.
lowlatency 1
autoframedelay 1
framedelay 0
