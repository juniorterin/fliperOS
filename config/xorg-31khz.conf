Section "Device"
    Identifier "GPU"
    Driver "modesetting"
    Option "Monitor-VGA-1" "CRT31"
EndSection
Section "Monitor"
    Identifier "CRT31"
    HorizSync 31.4 - 31.5
    VertRefresh 49.0 - 65.0
    # Modeline VGA industrial-padrao (640x480@60Hz, 25.2 MHz) — cai
    # exatamente na faixa do preset arcade_31 do Switchres (31400-31500 Hz).
    Modeline "640x480" 25.200 640 656 752 800 480 490 492 525 -HSync -VSync
    Option "PreferredMode" "640x480"
    Option "DPMS" "false"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "GPU"
    Monitor "CRT31"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "640x480"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
