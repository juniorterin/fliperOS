# Video mode of each program opened by fliperos-x11-run (Switchres creates
# the mode for the monitor chosen in the Setup and opens the program in it).
# Edit freely: the first column is the program name (the command, without a
# path), the second the mode on a 15 kHz monitor, the third on 25/31 kHz and
# LCD. Mode format: WIDTHxHEIGHT@HZ. A program not in the table: 320x240@60.
# On the spot, without editing: fliperos-x11-run --mode 640x240@60 program
# (FliperOS wiki, Emulators page, "Running a program at 640x240").
#
# At 15 kHz nothing opens interlaced: the 480i ones (Dreamcast, PS2,
# GameCube/Wii, laserdisc) and the 384-line ones (Model 2 and 3, which are
# medium resolution) run at 640x240 progressive, without interlace flicker.
# The exception is Fightcade: the lobby is a desktop page, which doesn't fit
# in 240 lines, and opens at 512x448 interlaced (wider pixels than 640x480,
# for bigger text; fewer lines than ~448 don't exist interlaced at 15 kHz).
# The matches don't: while one
# of its emulators is open the screen stays in the mode of the
# fightcade-<emulator> line (config/fliperos-fightcade), and goes back to the
# lobby's when it closes. At 15 kHz FBNeo and FBA open each game in its own
# resolution (from GroovyMAME); their lines are for the games it doesn't
# know. SNES9x runs at the console's 256x224.
#
# program           15 kHz          25/31 kHz and LCD
flycast             640x240@60      640x480@60
pcsx2               640x240@60      640x480@60
dolphin-emu         640x240@60      640x480@60
hypseus             640x240@60      640x480@60
singe               640x240@60      640x480@60
openbor             320x240@60      320x240@60
supermodel          640x240@57.524  496x384@57.524
fliperos-model2     640x240@57.524  496x384@57.524
sm2-emu             640x240@57.524  496x384@57.524
fightcade           512x448@60      640x480@60
fightcade-fbneo     320x240@60      640x480@60
fightcade-fc1       320x240@60      640x480@60
fightcade-snes9x    256x224@60.0988 640x480@60
fightcade-flycast   640x240@60      640x480@60
