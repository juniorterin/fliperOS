# Modo de video de cada programa aberto pelo fliperos-x11-run (o Switchres
# cria o modo no monitor escolhido no Setup e abre o programa nele). Edite a
# vontade: a primeira coluna e o nome do programa (o comando, sem caminho),
# a segunda o modo num monitor de 15 kHz, a terceira em 25/31 kHz e LCD.
# Formato do modo: LARGURAxALTURA@HZ. Programa fora da tabela: 320x240@60.
# Na hora, sem editar: fliperos-x11-run --mode 640x240@60 programa (README,
# "Rodar um programa em 640x240").
#
# Os de 480i (Dreamcast, PS2, GameCube/Wii, laserdisc) rodam em 640x240
# progressivo no 15 kHz: sem o cintilar do entrelacado.
#
# programa          15 kHz          25/31 kHz e LCD
flycast             640x240@60      640x480@60
pcsx2               640x240@60      640x480@60
dolphin-emu         640x240@60      640x480@60
hypseus             640x240@60      640x480@60
singe               640x240@60      640x480@60
openbor             320x240@60      320x240@60
supermodel          496x384@57.524  496x384@57.524
fliperos-model2     496x384@57.524  496x384@57.524
