# Firmware and Limine output are NOT protected by the kernel EDID override.
timeout: 5
# Text-mode menu, same as the old GRUB "terminal_output console".
graphics: no
# The branding line already says FliperOS 0.6, so entry titles skip it:
# Limine cuts titles at 62 characters.
interface_branding: FliperOS 0.6

/__MONITOR_LABEL__ (EDID VGA-1/DVI-I-1; validar hardware)
    # Guess at the two most common analog CRT connector names across the
    # AMD range this project targets (see hardware-scope notes). Forcing a
    # connector that doesn't exist on the card is a harmless no-op, so this
    # widens the chance of reaching a usable console without prior boot
    # menu editing. sudo fliperos-install falls back to
    # fliperos-video-autodetect (cycles VGA-*/DVI-I-* live) when neither
    # guess lands on an active mode.
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    # BIOS: hand the kernel VGA text mode, as GRUB did, instead of a VBE
    # mode picked by Limine (always above 15 kHz) until KMS applies the EDID.
    textmode: yes
    cmdline: boot=live video=VGA-1:e video=DVI-I-1:e drm.edid_firmware=VGA-1:edid/crt15.bin,DVI-I-1:edid/crt15.bin radeon.si_support=1 radeon.cik_support=1 amdgpu.si_support=0 amdgpu.cik_support=0 quiet splash

/Diagnostico LCD/VM (NAO usar no __MONITOR_LABEL__)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live nomodeset
