# Menu de boot da midia de instalacao: as mesmas opcoes do GroovyArcade
# (os/groovyarcade/syslinux/syslinux.cfg). Aqui se escolhe so a faixa de
# frequencia em que o Linux sobe; a saida e o monitor sao configurados
# depois, pelo teste de saidas do fliperos-setup.
#
# O menu em si sai em modo texto do firmware (~31 kHz): um monitor so de
# 15 kHz nao o mostra. Por isso a primeira entrada, 15 kHz, e a padrao: e a
# segura para um tubo de arcade. Mandar 31 kHz para um CRT so de 15 kHz pode
# danifica-lo; um LCD recebendo 15 kHz so mostra "fora de faixa".
#
# fliperos.boot= diz ao fliperos-setup qual entrada foi escolhida.
timeout: 30
default_entry: 1
# Menu em modo texto, como o antigo "terminal_output console" do GRUB.
graphics: no
interface_branding: FliperOS __VERSION__ - choose the video mode

/15 kHz
    comment: Arcade monitor or TV, 640x480 interlaced (safe default)
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    # BIOS: o kernel recebe o modo texto VGA, como fazia o GRUB, em vez de
    # um modo VBE escolhido pelo Limine (sempre acima de 15 kHz) ate o KMS
    # aplicar o modo de baixo dotclock.
    textmode: yes
    cmdline: boot=live fliperos.boot=15khz video=640x480iS __COMMON__

/25 kHz
    comment: Medium resolution arcade monitor, 512x384
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=25khz video=512x384S __COMMON__

/31 kHz
    comment: High resolution arcade monitor, 640x480
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=31khz video=640x480S __COMMON__

/SVGA / LCD monitor
    comment: PC monitor or LCD, the monitor's own EDID decides
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=svga __COMMON__

/Intel 15 kHz
    comment: Intel graphics, 1280x480 interlaced super resolution
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    # Sem dotclock baixo na Intel: super resolucao. O i915.no_ytiled_scanout
    # e do patch 09 e e o que deixa a Gen9 mostrar modo entrelacado.
    cmdline: boot=live fliperos.boot=intel video=1280x480iS i915.no_ytiled_scanout=1 __COMMON__

/NVIDIA 15 kHz
    comment: NVIDIA graphics, 1280x480 interlaced super resolution
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=nvidia video=1280x480iS __COMMON__

/NTSC
    comment: NTSC TV, 720x480 interlaced 60 Hz
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=ntsc video=720x480iS __COMMON__

/PAL
    comment: PAL TV, 768x576 interlaced 50 Hz
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=pal video=768x576iS __COMMON__

/EDID progressive
    comment: 15 kHz super resolution EDID, progressive, all outputs forced on
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=edid-progressive drm.edid_firmware=edid/generic_15_super_resp.bin video=e __COMMON__

/EDID interlaced
    comment: 15 kHz super resolution EDID, interlaced, all outputs forced on
    protocol: linux
    path: boot():/boot/vmlinuz
    module_path: boot():/boot/initrd.img
    textmode: yes
    cmdline: boot=live fliperos.boot=edid-interlaced drm.edid_firmware=edid/generic_15_super_resi.bin video=e __COMMON__
