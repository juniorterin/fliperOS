Section "Device"
    Identifier "GPU"
    Driver "modesetting"
    Option "Monitor-VGA-1" "CRT25"
EndSection
Section "Monitor"
    Identifier "CRT25"
    HorizSync 24.9 - 25.1
    VertRefresh 49.0 - 65.0
    # Timing calculado mirando o preset arcade_25 do Switchres (24960 Hz
    # fixo): 15.600 MHz / 625 = 24960.000 Hz; 24960 / 416 = 60.000 Hz.
    Modeline "512x384" 15.600 512 528 592 625 384 386 390 416 -HSync -VSync
    Option "PreferredMode" "512x384"
    Option "DPMS" "false"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "GPU"
    Monitor "CRT25"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "512x384"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
