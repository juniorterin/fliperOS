# Samba do FliperOS (fliperos-rootfs.sh). Como o gasetup do GroovyArcade,
# que exporta /home/arcade/shared, com uma diferenca deliberada: o
# GroovyArcade usa "public = yes" (gravavel sem senha); aqui a escrita exige o
# usuario fliperos, porque a ISO tambem sobe SSH com senha padrao.
[global]
   workgroup = WORKGROUP
   server string = FliperOS
   security = user
   map to guest = never
   disable netbios = no
   server min protocol = SMB2
   # /opt/fliperos/roms e um link para /home/fliperos/roms: sem seguir links
   # para fora do compartilhamento, a pasta apareceria vazia em \\fliperos\FliperOS.
   allow insecure wide links = yes
   unix extensions = no

[FliperOS]
   comment = Acervo do FliperOS (roms, bios, saves)
   path = /opt/fliperos
   available = yes
   browseable = yes
   writable = yes
   printable = no
   valid users = fliperos
   create mask = 0664
   directory mask = 0775
   wide links = yes

[roms]
   comment = ROMs (/home/fliperos/roms)
   path = /home/fliperos/roms
   available = yes
   browseable = yes
   writable = yes
   printable = no
   valid users = fliperos
   create mask = 0664
   directory mask = 0775

[bios]
   comment = BIOS (/home/fliperos/bios)
   path = /home/fliperos/bios
   available = yes
   browseable = yes
   writable = yes
   printable = no
   valid users = fliperos
   create mask = 0664
   directory mask = 0775

[media]
   comment = Arte e textos dos frontends (/home/fliperos/media)
   path = /home/fliperos/media
   available = yes
   browseable = yes
   writable = yes
   printable = no
   valid users = fliperos
   create mask = 0664
   directory mask = 0775

# Links para a configuracao de cada emulador (fliperos-roms): seguem para
# fora da pasta, como o /opt/fliperos/roms do [FliperOS].
[config]
   comment = Configuracoes dos emuladores (/home/fliperos/config)
   path = /home/fliperos/config
   available = yes
   browseable = yes
   writable = yes
   printable = no
   valid users = fliperos
   create mask = 0664
   directory mask = 0775
   wide links = yes
