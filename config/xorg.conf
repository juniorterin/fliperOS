Section "Device"
    Identifier "GPU"
    Driver "modesetting"
    Option "Monitor-VGA-1" "CRT15"
EndSection
Section "Monitor"
    Identifier "CRT15"
    HorizSync 15.0 - 16.0
    VertRefresh 49.0 - 65.0
    # Same detailed timing as firmware EDID: 13020 / 832 = 15.649038 kHz.
    Modeline "640x240" 13.020 640 666 728 832 240 242 245 261 -HSync -VSync
    Option "PreferredMode" "640x240"
    Option "DPMS" "false"
EndSection
Section "Screen"
    Identifier "Screen0"
    Device "GPU"
    Monitor "CRT15"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "640x240"
    EndSubSection
EndSection
Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
