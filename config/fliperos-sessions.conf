# Sessoes que o FliperOS pode abrir ao ligar a maquina.
#
# Formato: nome|backend|binario|pacote|descricao
#
# backend: kms   = roda direto no DRM/KMS, sem servidor grafico
#          x     = precisa de Xorg (via xinit)
#          text  = menu de texto no console
#          none  = nao abre nada
#
# "pacote" e o pacote do repositorio do FliperOS que fornece o binario; vazio
# quer dizer que ja vem na imagem. O wizard de instalacao usa essa coluna, e
# fliperos-config so oferece as sessoes cujo binario esta presente.
#
# Quais frontends funcionam em KMS nao e chute: vem da tabela de capacidades
# do GroovyArcade (galauncher/videodata.conf). O Attract-Mode ORIGINAL nao
# roda em KMS — so o fork Plus — por isso aqui e attractplus.
# O AdvanceMENU nao entra como launcher proprio: o projeto foi abandonado pelo
# GroovyArcade e o caminho KMS dele nao e documentado. A aparencia dele vem
# como tema do attractplus (layout AdvanceMenu, no pacote fliperos-attractplus).
launcher|text|/opt/fliperos/bin/fliperos-launcher||Menu de texto do FliperOS (sempre disponivel)
attractplus|kms|attractplus|fliperos-attractplus|Attract-Mode Plus — inclui tema AdvanceMenu
emulationstation|kms|emulationstation|fliperos-emulationstation|EmulationStation (sabor RetroPie)
retrofe|kms|retrofe|fliperos-retrofe|RetroFE
pegasus|kms|pegasus-fe|fliperos-pegasus|Pegasus
retroarch|kms|retroarch||Interface do RetroArch (so cores libretro)
groovymame|kms|groovymame||Interface do MAME (so roms de MAME)
openbox|x|openbox-session|openbox|Window manager leve, para baixa resolucao
shell|none|||Cai direto no shell
