# Launchers que o FliperOS pode abrir ao ligar (o "frontend" do galauncher
# do GroovyArcade).
#
# Formato: nome|backend|binario|pacote|descricao
#
# backend: kms   = roda direto no DRM/KMS, sem servidor grafico
#          x     = precisa de Xorg (via xinit)
#          none  = nao abre nada: o boot cai direto no menu do fliperos-setup
#
# "pacote" e o pacote que fornece o binario (o repositorio do FliperOS para
# os frontends); vazio quer dizer que ja vem na imagem. "fetch:COMANDO" e um
# programa que nao pode vir na imagem nem no repositorio (codigo fechado, sem
# permissao de redistribuir): o Setup o baixa do site dele, com
# "/opt/fliperos/bin/COMANDO fetch --progress", e o binario so existe depois
# disso. O primeiro boot e o Setup > Frontend so oferecem como prontos os que
# tem o binario instalado.
#
# Quais frontends funcionam em KMS vem da tabela do GroovyArcade
# (galauncher/videodata.conf). O Attract-Mode original nao roda em KMS, so o
# fork Plus. Openbox sozinho nao e opcao: o desktop e o LXDE completo. O
# GroovyMAME fica em kms, mas o comando groovymame se abre num Xorg proprio
# (config/fliperos-groovymame); o Fightcade 2 tambem (config/fliperos-fightcade).
setup|none|||FliperOS Setup menu
attractplus|kms|attractplus|fliperos-attractplus|Attract-Mode Plus
emulationstation|kms|emulationstation|fliperos-emulationstation|EmulationStation
retrofe|kms|retrofe|fliperos-retrofe|RetroFE
pegasus|kms|pegasus-fe|fliperos-pegasus|Pegasus
retroarch|kms|retroarch||RetroArch
groovymame|kms|groovymame||GroovyMAME
fightcade|kms|/opt/fliperos/fightcade/fightcade|fetch:fliperos-fightcade|Fightcade 2
lxde|x|/opt/fliperos/bin/fliperos-lxde|lxde|LXDE desktop
