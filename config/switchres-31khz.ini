# Switchres syntax is key value, without sections or '='.
monitor arcade_31
api xrandr
display auto
modeline_generation 1
# arcade_31 nao define linhas entrelacadas no Switchres (interlaced_lines
# 0,0) — diferente de arcade_15/arcade_25, entao fica desligado aqui.
interlace 0
doublescan 0
sync_refresh_tolerance 2.0
