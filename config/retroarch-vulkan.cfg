# RetroArch — o fliperos-kms-run passa este arquivo por cima do retroarch.cfg
# do sistema quando a placa do CRT esta no driver amdgpu (Setup > Video Setup >
# Video driver) e o RetroArch e o com o patch do khr_display
# (config/retroarch-patches), que troca o modo do CRT tambem em Vulkan. Em
# outro driver ou outra placa, fica o glcore do retroarch.cfg.
video_driver = "vulkan"
