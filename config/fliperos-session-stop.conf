# /etc/systemd/system/session-.scope.d/fliperos-stop.conf (fliperos-rootfs.sh):
# no reboot e no desligamento, o que sobrar na sessao do tty1 (o Setup, um
# jogo, o frontend) tem 10 s para sair depois do SIGTERM, nao os 90 s padrao:
# o gabinete ficava 90 s na tela de reboot do Plymouth.
[Scope]
TimeoutStopSec=10s
