set default=0
set timeout=5
# Firmware and GRUB output are NOT protected by the kernel EDID override.
terminal_output console

menuentry "FliperOS 0.6 - CRT 15kHz (EDID VGA-1; validar hardware)" {
    linux /boot/vmlinuz boot=live video=VGA-1:e drm.edid_firmware=VGA-1:edid/crt15.bin radeon.si_support=1 radeon.cik_support=1 amdgpu.si_support=0 amdgpu.cik_support=0
    initrd /boot/initrd.img
}

menuentry "FliperOS 0.6 - Diagnostico LCD/VM (NAO usar no CRT 15kHz)" {
    linux /boot/vmlinuz boot=live nomodeset
    initrd /boot/initrd.img
}
