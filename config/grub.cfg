set default=0
set timeout=5
# Firmware and GRUB output are NOT protected by the kernel EDID override.
terminal_output console

menuentry "FliperOS 0.6 - __MONITOR_LABEL__ (EDID VGA-1/DVI-I-1; validar hardware)" {
    # Guess at the two most common analog CRT connector names across the
    # AMD range this project targets (see hardware-scope notes). Forcing a
    # connector that doesn't exist on the card is a harmless no-op, so this
    # widens the chance of reaching a usable console without prior GRUB
    # editing. sudo fliperos-install falls back to fliperos-video-autodetect
    # (cycles VGA-*/DVI-I-* live) when neither guess lands on an active mode.
    linux /boot/vmlinuz boot=live video=VGA-1:e video=DVI-I-1:e drm.edid_firmware=VGA-1:edid/crt15.bin,DVI-I-1:edid/crt15.bin radeon.si_support=1 radeon.cik_support=1 amdgpu.si_support=0 amdgpu.cik_support=0
    initrd /boot/initrd.img
}

menuentry "FliperOS 0.6 - Diagnostico LCD/VM (NAO usar no __MONITOR_LABEL__)" {
    linux /boot/vmlinuz boot=live nomodeset
    initrd /boot/initrd.img
}
