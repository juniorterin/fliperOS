<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FliperOS Panel</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card login-card">
    <img src="icon.svg" alt="" class="login-icon">
    <h1>FliperOS</h1>
    <p data-t="login_text"></p>
    <label><span data-t="user"></span><input id="user" name="user" autocomplete="username" value="fliperos" required></label>
    <label><span data-t="password"></span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="error" role="alert"></p>
    <button type="submit" data-t="enter"></button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt=""><span>FliperOS</span><span id="version" class="dim"></span></div>
    <div id="host" class="dim"></div>
    <div class="top-actions">
      <button id="lang" class="ghost" type="button" aria-label="Language">PT</button>
      <button id="logout" class="ghost" type="button" data-t="logout"></button>
    </div>
  </header>
  <!-- As paginas (app.js, showPage): o endereco #frontend, #files... -->
  <nav class="pages" aria-label="Pages">
    <a href="#frontend" data-page="frontend" data-t="page_frontend"></a>
    <a href="#files" data-page="files" data-t="page_files"></a>
    <a href="#live" data-page="live" data-t="page_live"></a>
    <a href="#romfilter" data-page="romfilter" data-t="page_romfilter"></a>
    <a href="#settings" data-page="settings" data-t="page_settings"></a>
    <a href="#status" data-page="status" data-t="page_status"></a>
    <a href="#terminal" data-page="terminal" data-t="page_terminal"></a>
  </nav>
  <p id="offline" class="error banner" hidden data-t="offline"></p>

  <main class="grid">
    <!-- Frontend: o que esta aberto, os jogos, o volume, a tela e o trackball. -->
    <section class="card wide" data-page="frontend status" aria-labelledby="h-now">
      <h2 id="h-now" data-t="now_playing"></h2>
      <div class="now">
        <div>
          <div class="big" id="game">-</div>
          <div class="dim" id="game-detail"></div>
          <div class="dim" id="frontend"></div>
          <button id="close-game" class="ghost danger" type="button" data-t="close_game" hidden></button>
        </div>
        <div class="fps">
          <div class="big"><span id="fps">-</span> <small>FPS</small></div>
          <canvas id="fps-chart" width="320" height="70" aria-label="FPS, last minute"></canvas>
          <div class="dim" data-t="fps_note"></div>
        </div>
      </div>
    </section>

    <section class="card wide" data-page="frontend" aria-labelledby="h-games">
      <h2 id="h-games" data-t="games"></h2>
      <div class="games-bar">
        <select id="system" aria-label="System"></select>
        <div class="search-group">
          <input id="game-search" type="search" data-tp="search" autocomplete="off">
          <select id="game-filter" aria-label="Filter"></select>
        </div>
      </div>
      <p id="games-note" class="dim"></p>
      <ul id="games" class="games"></ul>
    </section>

    <section class="card" data-page="frontend" aria-labelledby="h-vol">
      <h2 id="h-vol" data-t="volume"></h2>
      <div class="volume">
        <button id="vol-down" type="button" aria-label="Volume down">−</button>
        <input id="vol" type="range" min="0" max="100" step="1" aria-label="Volume">
        <button id="vol-up" type="button" aria-label="Volume up">+</button>
        <span id="vol-value" class="big">-</span>
      </div>
      <button id="vol-mute" class="ghost" type="button" data-t="mute"></button>
    </section>

    <section class="card wide" data-page="frontend status" aria-labelledby="h-shot">
      <h2 id="h-shot" data-t="screen"></h2>
      <div class="row">
        <button id="shot-take" type="button" data-t="take_shot"></button>
        <label class="dim"><input id="shot-tube" type="checkbox" checked> <span data-t="as_on_tube"></span></label>
        <a id="shot-save" class="ghost-link" hidden data-t="save_png"></a>
      </div>
      <p id="shot-note" class="dim" role="status"></p>
      <img id="shot" class="shot tube" alt="" hidden>
    </section>

    <!-- Ao vivo: a tela do gabinete (WebRTC pelo go2rtc, config/fliperos-stream),
         a transmissao e os enderecos para o OBS (a tela e o marquee). -->
    <section class="card wide" data-page="live" aria-labelledby="h-live">
      <div class="live-head">
        <h2 id="h-live" data-t="live"></h2>
        <span id="live-badge" class="live-badge" hidden data-t="live_on_air"></span>
      </div>
      <div class="live-bar">
        <button id="live-start" type="button" data-icon="▶" data-t="live_start"></button>
        <button id="live-stop" class="ghost" type="button" data-icon="■" data-t="live_stop" hidden></button>
        <label class="dim"><span data-t="live_fps"></span>
          <select id="live-fps"><option value="15">15</option><option value="30" selected>30</option><option value="60">60</option></select></label>
        <label class="dim"><input id="live-tube" type="checkbox" checked> <span data-t="as_on_tube"></span></label>
        <span class="live-bar-end">
          <button id="live-sound" class="ghost" type="button" data-icon="🔇" data-t="live_unmute" hidden></button>
          <button id="live-full" class="ghost" type="button" data-icon="⤢" data-t="live_full" hidden></button>
        </span>
      </div>
      <div id="live-stage" class="live-stage tube">
        <video id="live" playsinline autoplay muted></video>
        <div id="live-idle" class="live-idle">
          <p id="live-idle-text"></p>
          <button id="live-play" type="button" class="live-play" data-icon="▶" data-t="live_start" hidden></button>
        </div>
      </div>
      <p id="live-note" class="dim live-note" role="status"></p>
    </section>

    <section class="card" data-page="live" aria-labelledby="h-live-set">
      <h2 id="h-live-set" data-t="live_settings"></h2>
      <dl class="live-facts">
        <div><dt data-t="live_service"></dt><dd id="live-service">-</dd></div>
        <div><dt data-t="live_encoder"></dt><dd id="live-encoder">-</dd></div>
        <div><dt data-t="live_sound"></dt><dd id="live-audio">-</dd></div>
      </dl>
      <div id="live-setup" class="live-actions"></div>
      <p class="dim" data-t="live_settings_note"></p>
    </section>

    <!-- O endereco da tela para o OBS: montado pelas escolhas abaixo dele. -->
    <section class="card live-obs-card" data-page="live" aria-labelledby="h-live-obs">
      <h2 id="h-live-obs" data-t="live_obs_title"></h2>
      <div id="live-obs" class="ovl-box">
        <div class="obs-url">
          <input id="live-url" type="text" readonly aria-label="OBS address">
          <button id="live-copy" type="button" data-icon="📋" data-t="copy"></button>
          <a id="live-open" class="ghost-link obs-open" target="_blank" rel="noopener" data-t="obs_open"></a>
        </div>
        <p id="live-obs-off" class="dim" data-t="live_obs_off" hidden></p>
        <div class="obs-opts">
          <label><span data-t="live_fps"></span>
            <select id="obs-fps"><option value="60" data-t="obs_fps60"></option><option value="30" data-t="obs_fps30"></option><option value="15" data-t="obs_fps15"></option></select></label>
          <label><span data-t="obs_fit"></span>
            <select id="obs-fit"><option value="" data-t="obs_fit_tube"></option><option value="fill" data-t="obs_fit_fill"></option></select></label>
          <label><span data-t="obs_size"></span>
            <select id="obs-size"><option value="1440x1080" data-t="obs_size_1440"></option><option value="960x720" data-t="obs_size_960"></option><option value="1920x1080" data-t="obs_size_1920"></option></select></label>
          <label class="obs-check"><input id="obs-sound" type="checkbox" checked> <span data-t="obs_sound"></span></label>
        </div>
        <ol class="obs-steps">
          <li data-t="obs_step1"></li>
          <li><span data-t="obs_step2"></span> <b id="obs-wh"></b></li>
          <li data-t="obs_step3"></li>
        </ol>
      </div>
    </section>

    <!-- O marquee do jogo como pagina para o OBS (overlay.html). -->
    <section class="card wide" data-page="live" aria-labelledby="h-ovl">
      <h2 id="h-ovl" data-t="overlay"></h2>
      <p class="dim" data-t="overlay_note"></p>
      <label class="ovl-toggle"><input id="ovl-on" type="checkbox"> <span data-t="overlay_on"></span></label>
      <div id="ovl-box" class="ovl-box" hidden>
        <div class="obs-url">
          <input id="ovl-url" type="text" readonly aria-label="Overlay address">
          <button id="ovl-copy" type="button" data-icon="📋" data-t="copy"></button>
          <a id="ovl-open" class="ghost-link obs-open" target="_blank" rel="noopener" data-t="obs_open"></a>
          <button id="ovl-new" class="ghost" type="button" data-icon="🔑" data-t="overlay_new"></button>
        </div>
        <div class="obs-opts">
          <label class="obs-check"><input id="ovl-led" type="checkbox"> <span data-t="ovl_led"></span></label>
          <label class="obs-check"><input id="ovl-text" type="checkbox" checked> <span data-t="ovl_text"></span></label>
          <label><span data-t="obs_size"></span>
            <select id="ovl-size"><option value="1280x320" data-t="ovl_size_1280"></option><option value="1920x480" data-t="ovl_size_1920"></option><option value="1024x256" data-t="ovl_size_1024"></option></select></label>
        </div>
        <p class="dim"><span data-t="ovl_obs"></span> <b id="ovl-wh"></b></p>
        <iframe id="ovl-preview" class="ovl-preview" title="Marquee preview"></iframe>
      </div>
    </section>

    <!-- O trackball esta desligado por enquanto (data-off; no servidor,
         FLIPEROS_WEB_TRACKBALL=1 o liga). -->
    <section class="card wide" data-page="frontend" data-off aria-labelledby="h-ball">
      <h2 id="h-ball" data-t="trackball"></h2>
      <div class="row">
        <button id="ball-open" type="button" data-t="ball_open"></button>
        <label class="dim"><span data-t="sensitivity"></span>
          <input id="ball-sens" type="range" min="0.5" max="6" step="0.25" value="2"></label>
        <label class="dim"><input id="ball-spin" type="checkbox" checked> <span data-t="inertia"></span></label>
        <span id="ball-note" class="dim" role="status"></span>
      </div>
      <div id="ball" class="ball" hidden>
        <div id="ball-pad" class="ball-pad" data-t="ball_hint"></div>
        <div class="ball-buttons">
          <button type="button" data-button="left" data-t="btn_left"></button>
          <button type="button" data-button="middle" data-t="btn_middle"></button>
          <button type="button" data-button="right" data-t="btn_right"></button>
        </div>
      </div>
    </section>

    <!-- Arquivos: as pastas, os downloads (torrent) e as tarefas. -->
    <section class="card wide" data-page="files" aria-labelledby="h-files">
      <h2 id="h-files" data-t="files"></h2>
      <div class="files-bar">
        <select id="file-root" aria-label="Folder"></select>
        <nav id="crumbs" class="crumbs" aria-label="Path"></nav>
      </div>
      <div class="files-actions">
        <label class="file-pick"><input id="file-input" type="file" multiple><span data-icon="📤" data-t="upload"></span></label>
        <button id="file-mkdir" class="ghost" type="button" data-icon="📁" data-t="new_folder"></button>
      </div>
      <div id="upload-status" class="dim" role="status"></div>
      <div id="file-drop" class="table-wrap drop"><table id="files"></table></div>
      <p class="dim" data-t="drop_hint"></p>
    </section>

    <section class="card wide" data-page="files" aria-labelledby="h-dl">
      <h2 id="h-dl" data-t="downloads"></h2>
      <div id="dl-line" class="row"><span id="dl-text"></span><span id="dl-pct" class="dim"></span></div>
      <div class="meter"><div id="dl-bar"></div></div>
      <p class="dim"><span data-t="dl_filter"></span> <span id="dl-filter"></span></p>
      <div id="dl-kinds" class="dl-kinds"></div>
      <div class="row">
        <button id="dl-start" type="button" data-icon="▶" data-t="dl_start"></button>
        <span class="dim" data-t="dl_note"></span>
      </div>
    </section>

    <section class="card wide" data-page="files" aria-labelledby="h-tasks">
      <h2 id="h-tasks" data-t="tasks"></h2>
      <ul id="tasks" class="tasks"></ul>
    </section>

    <!-- ROM filter: o filtro do MAME ROM Cleaner, para o Downloader ou para
         limpar uma pasta com um romset (app.js, ROM filter). -->
    <!-- O que filtrar: o modo (abas), a pasta, o emulador e o preset. -->
    <section class="card wide rf-setup" data-page="romfilter" aria-labelledby="h-rf">
      <div class="rf-head">
        <div>
          <h2 id="h-rf" data-t="page_romfilter"></h2>
          <p class="dim" data-t="rf_intro"></p>
        </div>
        <div class="rf-tabs" role="tablist" aria-label="Mode">
          <button type="button" role="tab" data-mode="downloader" data-icon="🧲" data-t="rf_mode_dl"></button>
          <button type="button" role="tab" data-mode="cleaner" data-icon="🧹" data-t="rf_mode_clean"></button>
        </div>
      </div>
      <div id="rf-source" class="rf-source" hidden>
        <span class="rf-source-icon" aria-hidden="true">📁</span>
        <div class="rf-source-text">
          <small data-t="rf_folder"></small>
          <span id="rf-folder"></span>
        </div>
        <button id="rf-browse" type="button" class="ghost" data-t="rf_choose"></button>
      </div>
      <div class="rf-bar">
        <label><small data-t="rf_emulator"></small><select id="rf-target"></select></label>
        <label><small data-t="rf_preset"></small><select id="rf-preset"></select></label>
      </div>
      <p class="rf-meta"><span data-t="rf_data"></span> <span id="rf-data"></span><br>
        <span data-t="rf_dest"></span> <span id="rf-dest"></span></p>
    </section>

    <!-- O placar: fica a vista ao rolar os parametros. -->
    <section class="card wide rf-score" data-page="romfilter" aria-label="Score">
      <div class="rf-led"><small data-t="rf_games"></small><span id="rf-games">-</span></div>
      <div class="rf-led"><small data-t="rf_size"></small><span id="rf-size">-</span></div>
      <div class="rf-score-note" role="status" aria-live="polite">
        <span id="rf-count-note"></span>
        <span id="rf-note" class="dim"></span>
      </div>
      <div class="rf-score-actions">
        <button id="rf-save" type="button" data-icon="💾" data-t="rf_save"></button>
        <button id="rf-scan" type="button" data-icon="🔍" data-t="rf_scan" hidden></button>
      </div>
    </section>

    <!-- Os parametros: um azulejo cada, em grupos; o azulejo abre as opcoes. -->
    <section class="card wide" data-page="romfilter" aria-label="Parameters">
      <div id="rf-board" class="rf-board"></div>
    </section>

    <section id="rf-preview" class="card wide rf-preview" data-page="romfilter" data-off aria-labelledby="h-rf-prev">
      <h2 id="h-rf-prev" data-t="rf_scan"></h2>
      <div id="rf-preview-body"></div>
    </section>

    <dialog id="rf-dialog" class="rf-dialog" aria-labelledby="rf-dlg-title">
      <form method="dialog">
        <header>
          <h3 id="rf-dlg-title"></h3>
          <button class="ghost icon-only" value="close" data-icon="✕" aria-label="Close"></button>
        </header>
        <p id="rf-dlg-help" class="dim"></p>
        <div id="rf-dlg-body"></div>
        <footer id="rf-dlg-foot">
          <button value="close" data-t="rf_done"></button>
        </footer>
      </form>
    </dialog>

    <!-- Configuracoes. -->
    <section class="card wide" data-page="settings" aria-labelledby="h-set">
      <h2 id="h-set" data-t="settings"></h2>
      <p class="dim" data-t="settings_note"></p>
      <div id="settings"></div>
    </section>

    <!-- Status: o video, o hardware, a rede, os processos e os logs. -->
    <section class="card wide" data-page="status" aria-labelledby="h-video">
      <h2 id="h-video" data-t="video"></h2>
      <div class="table-wrap"><table id="video-table"></table></div>
      <div id="modelines"></div>
    </section>

    <section class="card" data-page="status" aria-labelledby="h-cpu">
      <h2 id="h-cpu">CPU</h2>
      <div class="meter"><div id="cpu-bar"></div></div>
      <div class="row"><span id="cpu-total" class="big">-</span><span id="load" class="dim"></span></div>
      <div id="cores" class="cores"></div>
      <div id="temps" class="small-list"></div>
    </section>

    <section class="card" data-page="status" aria-labelledby="h-gpu">
      <h2 id="h-gpu">GPU</h2>
      <div id="gpus"></div>
    </section>

    <section class="card" data-page="status" aria-labelledby="h-mem">
      <h2 id="h-mem" data-t="memory"></h2>
      <div id="memory"></div>
    </section>

    <section class="card" data-page="status" aria-labelledby="h-disks">
      <h2 id="h-disks" data-t="storage"></h2>
      <div id="disks"></div>
    </section>

    <section class="card" data-page="status" aria-labelledby="h-net">
      <h2 id="h-net" data-t="network"></h2>
      <div id="network"></div>
    </section>

    <section class="card wide" data-page="status" aria-labelledby="h-proc">
      <h2 id="h-proc" data-t="processes"></h2>
      <div class="table-wrap"><table id="procs"></table></div>
    </section>

    <section class="card wide" data-page="status" aria-labelledby="h-logs">
      <h2 id="h-logs" data-t="logs"></h2>
      <div class="row">
        <select id="log-name" aria-label="Log"></select>
        <button id="log-refresh" class="ghost" type="button" data-t="refresh"></button>
      </div>
      <pre id="log-text" class="log"></pre>
    </section>

    <!-- Terminal. -->
    <section class="card wide" data-page="terminal" aria-labelledby="h-term">
      <h2 id="h-term" data-t="terminal"></h2>
      <div class="row">
        <button id="term-open" type="button" data-t="term_open"></button>
        <button id="term-close" class="ghost" type="button" data-t="term_close" hidden></button>
        <span id="term-note" class="dim" role="status"></span>
      </div>
      <div id="term" class="term" hidden></div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
