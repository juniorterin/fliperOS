<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FliperOS Live</title>
<!-- A tela do gabinete ao vivo para o Browser Source do OBS (config/fliperos-web,
     /overlay/live?key=CHAVE&fps=60): em 4:3, como no tubo, ocupando a fonte;
     &fit=fill estica para a fonte inteira; &muted=1 sem som. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; font: 600 14px/1.3 system-ui, sans-serif; color: #f8f8f2; }
  .box { aspect-ratio: 4 / 3; width: min(100vw, 133.334vh); }
  .fill .box { width: 100vw; height: 100vh; aspect-ratio: auto; }
  video { display: block; width: 100%; height: 100%; object-fit: fill; background: #000; }
  .note { position: fixed; left: 8px; bottom: 8px; margin: 0; padding: 4px 8px; border-radius: 6px;
    background: rgba(25, 26, 33, .85); }
  .note.bad { color: #ff5555; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="box"><video id="video" autoplay playsinline></video></div>
<p id="note" class="note" hidden></p>
<script src="/live.js"></script>
</body>
</html>
