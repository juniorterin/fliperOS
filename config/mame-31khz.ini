# GroovyMAME / Xorg. Dynamic switching still requires testing on the target GPU.
rompath /opt/fliperos/roms/mame
samplepath /opt/fliperos/roms/mame/samples
video opengl
switchres 1
monitor arcade_31
# arcade_31 nao define linhas entrelacadas no Switchres (interlaced_lines
# 0,0) — diferente de arcade_15/arcade_25, entao fica desligado aqui.
interlace 0
resolution auto
window 0
keepaspect 1
joystick 1
samplerate 48000
