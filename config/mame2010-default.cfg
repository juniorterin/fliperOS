<?xml version="1.0"?>
<!-- FliperOS (config/mame2010-default.cfg): os botoes de cada jogador so pelo
     RetroPad (Joy N Button M), sem as teclas padrao do MAME. O painel que e um
     teclado (LCtrl, LAlt, Espaco...) chegava duas vezes: pelo teclado, que o
     core le direto, e pelo RetroPad do RetroArch (buttons.cfg e o remap). -->
<mameconfig version="10">
    <system name="default">
        <input>
            <port type="P1_BUTTON1">
                <newseq type="standard">
                    JOYCODE_1_BUTTON1
                </newseq>
            </port>
            <port type="P1_BUTTON2">
                <newseq type="standard">
                    JOYCODE_1_BUTTON2
                </newseq>
            </port>
            <port type="P1_BUTTON3">
