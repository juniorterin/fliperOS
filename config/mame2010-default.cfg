                    JOYCODE_1_BUTTON4
                </newseq>
            </port>
            <port type="P1_BUTTON5">
                <newseq type="standard">
                    JOYCODE_1_BUTTON5
                </newseq>
            </port>
            <port type="P1_BUTTON6">
                <newseq type="standard">
                    JOYCODE_1_BUTTON6
                </newseq>
            </port>
            <port type="P2_BUTTON1">
                <newseq type="standard">
                    JOYCODE_2_BUTTON1
                </newseq>
