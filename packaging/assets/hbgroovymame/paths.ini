# hbgroovymame (HBMAME com o Switchres do GroovyMAME): as pastas dele.
#
# O comando hbgroovymame (config/fliperos-groovymame, o mesmo script do
# groovymame) monta o /etc/fliperos/hbmame/hbmame.ini do mame.ini do sistema
# (o monitor, o formato da tela, a latencia, os botoes: tudo o que o Setup
# grava vale para os dois) e poe estas linhas por cima. O GroovyMAME usa a
# pasta mame; este usa a pasta hbmame, e nada se mistura: os cfg, as nvrams,
# os estados e as capturas ficam separados.
homepath                  $HOME/.hbmame
# As BIOS tambem podem ficar em ~/bios/hbmame; a ~/bios/mame (neogeo.zip,
# qsound.zip...) vale para os dois, sem copiar.
rompath                   /home/fliperos/roms/hbmame;/home/fliperos/bios/hbmame;/home/fliperos/bios/mame
samplepath                /home/fliperos/roms/hbmame/samples
hashpath                  $HOME/.hbmame/hash;/usr/local/share/hbgroovymame/hash
artpath                   $HOME/.hbmame/artwork;/usr/local/share/hbgroovymame/artwork
# O ctrlr do Button mapping (Setup > Joysticks) e um so, em ~/.mame/ctrlr.
ctrlrpath                 $HOME/.mame/ctrlr;$HOME/.hbmame/ctrlr;/usr/local/share/hbgroovymame/ctrlr
fontpath                  /usr/local/share/hbgroovymame/fonts;$HOME/.hbmame/fonts
pluginspath               /usr/local/share/hbgroovymame/plugins;$HOME/.hbmame/plugins
languagepath              $HOME/.hbmame/language;/usr/local/share/hbgroovymame/language
bgfx_path                 /usr/local/share/hbgroovymame/bgfx
cheatpath                 $HOME/.hbmame/cheat
crosshairpath             $HOME/.hbmame/crosshair
swpath                    $HOME/.hbmame/software
cfg_directory             $HOME/.hbmame/cfg
nvram_directory           $HOME/nvram/hbmame
input_directory           $HOME/.hbmame/inp
state_directory           $HOME/save/hbmame
snapshot_directory        $HOME/.hbmame/snap;/home/fliperos/media/snap/hbmame
diff_directory            $HOME/.hbmame/diff
comment_directory         $HOME/.hbmame/comments
