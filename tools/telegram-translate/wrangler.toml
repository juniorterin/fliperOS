name = "fliperos-telegram-translate"
main = "worker.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"

[vars]
# id numerico do grupo (comeca com -100); vazio aceita qualquer chat
ALLOWED_CHAT = ""
# topicos sem traducao (ex.: Files/Arquivos): o numero no fim do link do
# topico (t.me/fliperos15khz/NUMERO), separados por virgula
SKIP_TOPICS = "578"
