# ISO nos Releases do GitHub, com o changelog da versao.
#
# Um push de tag de versao (git tag 0.8 && git push origin 0.8) gera a ISO
# no mesmo Docker do build local (Dockerfile.fliperos) e a publica pelo
# tools/release-publish.sh: auditoria (verify-iso.sh), o texto da secao
# "## 0.8" do CHANGELOG.md, a lista de pacotes e o SHA-256. A tag tem de ser
# o FLIPEROS_VERSION do fliperos-mkiso.sh.
#
# Publicada a ISO, o workflow Telegram posta no grupo o docs/telegram/VERSAO.md
# (fotos e como funcionam as novidades) ou, sem ele, a secao do CHANGELOG.
#
# Rodar a mao (Actions > Release > Run workflow) gera a ISO da versao atual
# como artifact, sem publicar.
#
# Refazer uma versao (git tag -f 0.8 && git push -f origin 0.8): o build da
# tag de antes que ainda roda e cancelado, e o release dela, se ja saiu, e
# trocado pelo da tag nova.
name: Release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      OUT: /mnt/output
    steps:
      - uses: actions/checkout@v5

      - name: Versao, tag e changelog
        id: version
        run: |
          version=$(sed -n 's/^FLIPEROS_VERSION="\(.*\)"$/\1/p' fliperos-mkiso.sh)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$version" ]]; then
            echo "::error::a tag $GITHUB_REF_NAME nao e o FLIPEROS_VERSION do fliperos-mkiso.sh ($version)"
            exit 1
          fi
          bash tools/release-publish.sh --notes "$version" > /dev/null \
            || { echo "::error::CHANGELOG.md sem a secao \"## $version\""; exit 1; }
          # O texto do grupo do Telegram (docs/telegram/VERSAO.md com fotos, ou a
          # secao do CHANGELOG) tem de estar bem formado antes de gastar horas de build.
          # O indice do runner pode estar velho (404 no .deb): update antes.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil > /dev/null
          python3 tools/telegram-post.py --dry-run "$version" > /dev/null \
            || { echo "::error::texto do Telegram invalido (tools/telegram-post.py --dry-run $version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kernel=$(bash fliperos-kernel.sh key)" >> "$GITHUB_OUTPUT"

      # O chroot e a arvore do kernel passam de 20 GB: o Docker e a saida vao
      # para o /mnt, e saem os SDKs que o runner traz e o build nao usa.
      - name: Espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo systemctl stop docker docker.socket
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          sudo mkdir -p "$OUT"
          sudo chown "$USER:" "$OUT"
          df -h / /mnt

      - name: Cache do kernel 15 kHz
        uses: actions/cache@v5
        with:
          path: /mnt/output/kernel-cache
          key: kernel-${{ steps.version.outputs.kernel }}

      - name: Cache dos frontends (.deb)
        id: packages
        uses: actions/cache@v5
        with:
          path: /mnt/output/packages
          key: packages-${{ hashFiles('packaging/**', 'Dockerfile.packages') }}

      # Os .deb ja publicados no release "packages" (os mesmos que os updates
      # levam: updates/packages.list, conferidos pelo sha256) entram prontos, e
      # so se compila a receita que ainda nao tem o seu (o GroovyMAME levaria
      # horas). Quem instala a ISO e quem so aplica os updates ficam com o
      # mesmo binario.
      - name: Repositorio dos frontends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker build -f Dockerfile.packages -t fliperos-packages .
          recipes=$(bash packaging/build-deb.sh --list-iso | tr '\n' ' ')
          if [ '${{ steps.packages.outputs.cache-hit }}' != true ]; then
            mkdir -p "$OUT/packages"
            grep -v '^#' updates/packages.list | while read -r name version sum when; do
              [ -n "$name" ] || continue
              deb="${name}_${version}_amd64.deb"
              if gh release download packages -R "$GITHUB_REPOSITORY" -p "$deb" -D "$OUT/packages" --skip-existing; then
                echo "$sum  $OUT/packages/$deb" | sha256sum -c --quiet - || rm -f "$OUT/packages/$deb"
              fi
            done
          fi
          docker run --rm -v "$OUT:/pkg/output" fliperos-packages bash -c "
            set -e
            if [ '${{ steps.packages.outputs.cache-hit }}' != true ]; then bash packaging/build-deb.sh --skip-existing $recipes; fi
            bash packaging/make-repo.sh"

      - name: ISO
        run: |
          docker build -f Dockerfile.fliperos -t fliperos-builder .
          docker run --rm --privileged --mount "type=bind,source=$OUT,target=/output" fliperos-builder bash -c '
            bash /build/fliperos-mkiso.sh --output /output/fliperos-${{ steps.version.outputs.version }}.iso
            rc=$?
            cp /var/log/fliperos-mkiso.log /output/ 2> /dev/null
            exit $rc'
          ls -l "$OUT"/*.iso

      - name: Log do build
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fliperos-mkiso-log
          path: /mnt/output/fliperos-mkiso.log
          retention-days: 7

      - name: Ferramentas da auditoria
        run: docker build -t fliperos-vmtest -f tools/Dockerfile.vmtest tools

      # Na tag, o release-publish.sh ja audita antes de publicar.
      - name: Auditoria
        if: github.ref_type != 'tag'
        run: |
          docker run --rm -v "$PWD:/w:ro" -v "$OUT:/out:ro" -w /w fliperos-vmtest \
            bash tools/verify-iso.sh /out/fliperos-${{ steps.version.outputs.version }}.iso

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/w:ro" -v "$OUT:/out:ro" -w /w fliperos-vmtest \
            bash tools/release-publish.sh --replace /out/fliperos-${{ steps.version.outputs.version }}.iso

      - name: ISO como artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: fliperos-${{ steps.version.outputs.version }}
          path: /mnt/output/fliperos-${{ steps.version.outputs.version }}.iso
          retention-days: 3
          compression-level: 0

  # Com o release publicado, o grupo do Telegram recebe o texto da versao
  # (docs/telegram/VERSAO.md). Falhar aqui nao desfaz o release: o workflow
  # Telegram roda de novo a mao.
  telegram:
    needs: iso
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/telegram.yml
    with:
      version: ${{ needs.iso.outputs.version }}
    secrets: inherit
